services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: teachme
      POSTGRES_PASSWORD: teachme
      POSTGRES_DB: teachme
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teachme -d teachme"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
volumes:
  pgdata:
