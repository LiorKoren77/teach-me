[project]
name = "teach-me"
version = "0.1.0"
description = "Textbook-to-tutorial tutor backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "anthropic>=1.5",
  "voyageai>=0.3",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3",
  "pypdf>=5.0",
  "typer>=0.12",
  "tenacity>=9.0",
  "boto3>=1.35",
  "vercel>=0.11",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "moto[s3,sqs]>=5",
  "ruff>=0.6",
  "uvicorn>=0.30",
  "httpx>=0.27",
]

[project.scripts]
teachme = "teachme.cli.main:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "api"}

[tool.setuptools.packages.find]
where = ["api"]
include = ["teachme*"]

[tool.setuptools.package-data]
teachme = ["**/*.md", "**/*.sql"]

[tool.pytest.ini_options]
testpaths = ["api/tests"]
pythonpath = ["api"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["api"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]
